<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lorofy Admin - platform management console"
    />
    <meta name="theme-color" content="#071B12" />
    <link
      rel="preload"
      href="/fonts/Fredoka-Variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/NerkoOne-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script>
      (() => {
        try {
          const raw = localStorage.getItem("lorofy.admin.theme.settings.v1");
          let theme = "light";
          if (raw) {
            try {
              theme = JSON.parse(raw)?.theme ?? "light";
            } catch {
              theme = raw;
            }
          }
          const dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          // Keep default light theme
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/lorofy.png" />
    <title>Lorofy Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
